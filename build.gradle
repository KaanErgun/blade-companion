plugins {
    id 'com.android.application' version '8.7.3' apply false
}

tasks.named('wrapper') {
    gradleVersion = '8.9'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab'
}

tasks.register('check') {
    group = 'verification'
    description = 'Compile, lint, run core checks, and build the debug APK.'
    dependsOn ':app:compileDebugJavaWithJavac', ':app:lintDebug', ':app:verifyCore', ':app:assembleDebug'
}
